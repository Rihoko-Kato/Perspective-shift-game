<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Perspective Shift</title>
    <style>
      /* 16:9 canvas, as large as the window allows, centred on black (requirements NF-04). */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; background: #000; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(320px, 60vw);
                 color: #bbb; font: 14px/1.6 sans-serif; text-align: center; }
      #loading .bar { height: 2px; margin-top: 10px; background: #333; }
      #loading .fill { height: 100%; width: 0; background: #ddd; transition: width .2s; }
      #fullscreen { position: fixed; right: 10px; bottom: 10px; padding: 4px 10px; border: 1px solid #555; border-radius: 4px;
                    background: rgba(0,0,0,.5); color: #aaa; font: 12px sans-serif; cursor: pointer; opacity: .35; transition: opacity .2s; }
      #fullscreen:hover { opacity: 1; }
      #error { display: none; position: fixed; inset: auto 16px 16px 16px; padding: 10px; background: #a22; color: #fff; font: 13px sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
    </div>
    <div id="loading">読み込み中…<div class="bar"><div class="fill"></div></div></div>
    <button id="fullscreen" hidden>全画面</button>
    <div id="error"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var aspect = 1280 / 720;

      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        if (w / h > aspect) w = h * aspect; else h = w / aspect;
        canvas.style.width = Math.floor(w) + "px";
        canvas.style.height = Math.floor(h) + "px";
      }
      window.addEventListener("resize", fit);
      fit();

      // Right-drag turns the camera: keep the browser menu out of the way.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      function showError(message) {
        var box = document.querySelector("#error");
        box.textContent = message;
        box.style.display = "block";
      }

      var script = document.createElement("script");
      script.src = "Build/Web.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, {
          arguments: [],
          dataUrl: "Build/Web.data.unityweb",
          frameworkUrl: "Build/Web.framework.js.unityweb",
          codeUrl: "Build/Web.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "Perspective Shift",
          productVersion: "0.1.0",
          // Retina screens: cap the render resolution to keep 60 fps (1280×720 CSS → at most 1920×1080).
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
          showBanner: function (message, type) { if (type === "error") showError(message); else console.log(message); },
        }, function (progress) {
          document.querySelector("#loading .fill").style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          document.querySelector("#loading").style.display = "none";
          var button = document.querySelector("#fullscreen");
          button.hidden = false;
          button.onclick = function () { unityInstance.SetFullscreen(1); };
        }).catch(showError);
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
